version: '3.8'

services:
  # -----------------------------------------------
  # App: Laravel + Octane + RoadRunner
  # -----------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    container_name: devknowledge_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      - redis
    networks:
      - devknowledge_network

  # -----------------------------------------------
  # Web: Nginx como proxy inverso hacia Octane
  # -----------------------------------------------
  web:
    image: nginx:alpine
    container_name: devknowledge_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - devknowledge_network

  # -----------------------------------------------
  # Redis: Cache, Sessions y Queues
  # -----------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: devknowledge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devknowledge_redis_data:/data
    networks:
      - devknowledge_network

networks:
  devknowledge_network:
    driver: bridge

volumes:
  devknowledge_redis_data:
